<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Protected Iframe</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.svg">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
        }
        input {
            padding: 10px;
            margin: 10px 0;
            width: calc(100% - 22px);
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        #iframeContainer {
            margin-top: 20px;
            display: none;
            width: 100%;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enter PIN to Access Content</h1>
        <input type="password" id="pinInput" placeholder="Enter PIN">
        <button onclick="checkPin()">Submit</button>
        <div id="iframeContainer">
            <iframe id="protectedIframe" src=""></iframe>
        </div>
    </div>

    <script>
        const validPins = ['1910', 'Nihaan', 'Tarun'];

        function checkPin() {
            const pinInput = document.getElementById('pinInput').value;
            if (validPins.includes(pinInput)) {
                document.getElementById('iframeContainer').style.display = 'block';
                document.getElementById('protectedIframe').src = 'https://free.digitalsamba.com/i70kQpJhc2FVpFy';
            } else {
                alert('Invalid PIN. Please try again.');
            }
        }
    </script>
</body>
</html>
